name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
            REDIS_URL: redis://localhost:6379
            REQUIRE_AUTH: "false"
            ALLOW_UNAUTHENTICATED_DEV_HEADERS: "true"
            ENVIRONMENT: "test"
            AUTH_SECRET_KEY: "c47a98b0f81d2f195e26b17c80523f46da9a738c642e051783e4bb9057d2913e"
        run: |
            pytest tests/ -v

  docker-compose-deployment:
    name: Docker Compose Deployment & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images
        run: |
          docker compose build

      - name: Verify Redis Port 6379 Is Not Publicly Published
        run: |
          # Ensure docker-compose.yml does not bind Redis port 6379 to host interfaces
          PUBLISHED_PORTS=$(docker compose config | grep -E "published: ['\"]?6379" || true)
          if [ -n "$PUBLISHED_PORTS" ]; then
            echo "SECURITY ERROR: Redis port 6379 is published publicly to host!"
            exit 1
          fi
          echo "VERIFIED: Redis port 6379 is strictly isolated to internal container network."

      - name: Verify Fail-Closed Prevention of API Startup on Incorrect Redis Password
        run: |
          # Generate test environment with password-protected Redis
          cat << 'EOF' > .env.badauth
          ENVIRONMENT=production
          AUTH_SECRET_KEY=c47a98b0f81d2f195e26b17c80523f46da9a738c642e051783e4bb9057d2913e
          ADMIN_API_KEY=test-admin-secret-at-least-32-chars-long-12345
          METRICS_API_KEY=test-metrics-secret-at-least-32-chars-12345
          REDIS_PASSWORD=correct_redis_auth_token_32_chars_12345
          REDIS_AUTH_REQUIRED=true
          REQUIRE_AUTH=true
          PROTECT_METRICS=true
          RATE_LIMITER_FAILURE_MODE=fail_closed
          EOF

          # Start Redis with authentication
          docker compose --env-file .env.badauth up -d redis

          # Wait for Redis healthcheck
          REDIS_HEALTHY=0
          for i in $(seq 1 15); do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' rate_limiter_redis 2>/dev/null || echo '"starting"')
            if [ "$HEALTH" = '"healthy"' ]; then
              echo "Redis is healthy."
              REDIS_HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ $REDIS_HEALTHY -ne 1 ]; then
            echo "REDIS STARTUP ERROR: Redis container failed to report healthy within timeout. Container state:"
            docker inspect rate_limiter_redis 2>/dev/null || true
            docker logs rate_limiter_redis 2>/dev/null || true
            exit 1
          fi

          # Launch API container with incorrect Redis credentials
          echo "Verifying API fails fast with bad Redis credentials..."
          CONTAINER_ID=$(docker run -d \
            --network rate_limiter_net \
            -e ENVIRONMENT=production \
            -e AUTH_SECRET_KEY=c47a98b0f81d2f195e26b17c80523f46da9a738c642e051783e4bb9057d2913e \
            -e ADMIN_API_KEY=test-admin-secret-at-least-32-chars-long-12345 \
            -e REDIS_URL=redis://rate_limiter_redis:6379 \
            -e REDIS_PASSWORD=wrong_password_attempt_32_chars_long \
            -e RATE_LIMITER_FAILURE_MODE=fail_closed \
            rate-limiter-api:latest)

          if [ -z "$CONTAINER_ID" ]; then
            echo "DOCKER RUN ERROR: Failed to launch API container!"
            exit 1
          fi

          echo "Launched API container: $CONTAINER_ID. Monitoring exit status..."

          CONTAINER_EXITED=0
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
            echo "Status check $i: $STATUS"
            if [ "$STATUS" = "exited" ]; then
              CONTAINER_EXITED=1
              break
            fi
            sleep 2
          done

          LOGS=$(docker logs "$CONTAINER_ID" 2>&1)
          docker rm -f "$CONTAINER_ID" 2>/dev/null || true

          echo "Container Logs:"
          echo "$LOGS"

          if [ $CONTAINER_EXITED -ne 1 ]; then
            echo "SECURITY ERROR: API container unexpectedly started and remained running despite invalid Redis password!"
            exit 1
          fi

          # Require an explicit Redis authentication rejection error (rejecting generic network/connectivity errors)
          if ! echo "$LOGS" | grep -qE "redis\.exceptions\.AuthenticationError|invalid username-password pair|WRONGPASS"; then
            echo "SECURITY ERROR: API container exited for an unexpected reason (not explicit Redis authentication rejection)!"
            echo "Actual container logs:"
            echo "$LOGS"
            exit 1
          fi

          echo "VERIFIED: API container exited specifically due to Redis authentication rejection."

          # Clean up badauth container state
          docker compose --env-file .env.badauth down -v
          rm -f .env.badauth

      - name: Launch Full-Stack Production Deployment With Authenticated Redis
        run: |
          cat << 'EOF' > .env.deploy
          ENVIRONMENT=production
          AUTH_SECRET_KEY=c47a98b0f81d2f195e26b17c80523f46da9a738c642e051783e4bb9057d2913e
          ADMIN_API_KEY=test-admin-secret-at-least-32-chars-long-12345
          METRICS_API_KEY=test-metrics-secret-at-least-32-chars-12345
          REDIS_PASSWORD=correct_redis_auth_token_32_chars_12345
          REDIS_AUTH_REQUIRED=true
          REQUIRE_AUTH=true
          PROTECT_METRICS=true
          RATE_LIMITER_FAILURE_MODE=fail_closed
          EOF

          docker compose --env-file .env.deploy up -d

          # Wait for API to report healthy
          API_HEALTHY=0
          for i in $(seq 1 20); do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' rate_limiter_api 2>/dev/null || echo '"starting"')
            if [ "$HEALTH" = '"healthy"' ]; then
              echo "API is healthy."
              API_HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ $API_HEALTHY -ne 1 ]; then
            echo "DEPLOYMENT ERROR: API container failed to report healthy within timeout."
            docker inspect rate_limiter_api
            docker logs rate_limiter_api
            exit 1
          fi

      - name: Verify Redis Port Isolation and API Health Endpoint
        run: |
          # 1. Verify port 6379 is not bound on host
          if nc -z 127.0.0.1 6379 2>/dev/null; then
            echo "SECURITY ERROR: Redis port 6379 is open on host 127.0.0.1!"
            exit 1
          fi
          echo "VERIFIED: Host cannot connect to Redis port 6379 directly."

          # 2. Verify API health endpoint
          RESPONSE=$(curl -fsS http://127.0.0.1:8000/)
          echo "API Response: $RESPONSE"
          python3 -c "import sys, json; data = json.load(sys.stdin); assert data.get('redis_connected') is True, f'Unexpected health response: {data}'" <<< "$RESPONSE"
          echo "VERIFIED: API is healthy and connected to authenticated Redis."

      - name: Clean Up Docker Compose Resources
        if: always()
        run: |
          docker compose --env-file .env.deploy down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          rm -f .env.deploy .env.badauth

