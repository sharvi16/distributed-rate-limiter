services:
  redis:
    image: redis:7-alpine
    container_name: rate_limiter_redis
    # Operational Security (Priority 3, Item 11):
    # Port 6379 is NOT exposed publicly on 0.0.0.0 by default to prevent unauthorized access.
    # It is reachable exclusively by the 'api' container across the internal 'rate_limiter_net' bridge network.
    # ports:
    #   - "127.0.0.1:6379:6379"  # For local debugging only; never bind 0.0.0.0:6379 in production.
    volumes:
      - redis_data:/data
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
        else
          exec redis-server --appendonly yes
        fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rate_limiter_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate_limiter_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_AUTH_REQUIRED=${REDIS_AUTH_REQUIRED:-true}
      - RATE_LIMITER_FAILURE_MODE=fail_closed
      # Restrict trusted proxies strictly to actual reverse proxies / loopback (never blanket RFC1918 CIDRs)
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - PROTECT_METRICS=${PROTECT_METRICS:-true}
      - METRICS_API_KEY=${METRICS_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rate_limiter_net

volumes:
  redis_data:
    driver: local

networks:
  rate_limiter_net:
    driver: bridge
